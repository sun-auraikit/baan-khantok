body.staff-view .main, body.staff-view .topbar{background:#263E59;color:#FFF9EF}body.staff-view .topbar{border-color:#405A75}body.staff-view .content{max-width:none;padding:26px 28px}body.staff-view .crumb{color:#E7D0AB}body.staff-view .topbar strong{color:#FFF9EF}body.staff-view .staff-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-bottom:22px}body.staff-view .staff-head h2{font-size:29px;margin:0 0 4px;color:#FFF9EF}body.staff-view .staff-head p{color:#E7D0AB;margin:0}body.staff-view .staff-date{display:flex;align-items:center;gap:10px;margin:20px 0 22px;color:#a8c7bc}body.staff-view .staff-date input{width:auto;min-width:195px;background:#172522;border-color:#354a45;color:#FFF9EF}body.staff-view .staff-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}body.staff-view .staff-card{background:#344F6D;border:1px solid #526D89;border-radius:16px;padding:20px;min-width:0;box-shadow:none;color:#FFF9EF}body.staff-view .staff-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}body.staff-view .staff-card h3{margin:0 0 4px;font-size:19px;color:#FFF9EF}body.staff-view .staff-role,body.staff-view .staff-meta,body.staff-view .staff-progress-label{color:#E7D0AB}body.staff-view .staff-meta{margin:13px 0;font-size:13px}body.staff-view .staff-card .btn{background:#344F6D;color:#FFF9EF;border-color:#6D8197}body.staff-view .staff-card .btn:hover{background:#405F80}body.staff-view .staff-card .btn.primary{background:#EBA84F;border-color:#EBA84F;color:#49371F}body.staff-view .staff-card .btn:disabled{opacity:.45;cursor:not-allowed}body.staff-view .staff-progress-row{display:flex;align-items:center;gap:10px;margin:14px 0 20px}body.staff-view .staff-progress-row .progress{flex:1;background:#52677D;height:8px}body.staff-view .staff-progress-row .progress span{background:#EBA84F}body.staff-view .staff-progress-label{margin-bottom:10px;font-size:13px}body.staff-view <div class="notice">เมื่อยืนยันการผลิต ระบบต้นแบบจะหักวัตถุดิบตามสูตรและเพิ่มสินค้าสำเร็จรูปในรายการสินค้า สต็อกสินค้ารีแพ็คจัดการในหน้านี้แยกจากสินค้าขาย</div>

<div class="card"><div class="section-title"><h3>สถานะใบงานผลิต</h3><small>${state.batches.length} ใบงาน</small></div><div class="table-wrap"><table><thead><tr><th>เลขใบงาน</th><th>สินค้า</th><th>จำนวน</th><th>สถานะ</th></tr></thead><tbody>${state.batches.map(b=>`<tr><td>${esc(b.id)}</td><td>${esc(b.outputName)}</td><td>${fmt(b.plannedQty)} ${esc(b.unit)}</td><td>${statusTag(b.status)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">ยังไม่มีใบงานผลิต</td></tr>'}</tbody></table></div></div></div>`}
function purchasing(){return `<div class="page-head"><div><h2>สั่งซื้อและรับสินค้า</h2><p>รวมใบสั่งซื้อ ผู้จำหน่าย กำหนดรับ และการกระจายสินค้าเข้าคลังตามประเภท</p></div><div class="actions"><button class="btn" data-action="importpo">↑ นำเข้า PO</button><button class="btn primary" data-action="newpo">＋ สร้างใบสั่งซื้อ</button></div></div>

function staff(){
 const date=$('#staffDate')?.value||today();
 const allNames=[...(state.settings.staffMembers||[]),...state.attendance.map(a=>a.name),...state.tasks.map(t=>t.assigned)].filter(Boolean);
 const names=[...new Set(allNames)].filter(n=>n.trim());
 const staffNames=names.length?names:['อรณี','เฟรม','ฟ้า'];
 const tasksFor=(name)=>state.tasks.filter(t=>t.assigned===name&&(String(t.due||'').slice(0,10)===date));
 const attFor=(name)=>state.attendance.find(a=>a.name===name&&a.date===date);
 const doneFor=(name)=>tasksFor(name).filter(t=>t.status==='done').length;
 const allToday=state.tasks.filter(t=>String(t.due||'').slice(0,10)===date);
 const completed=allToday.filter(t=>t.status==='done').length;
 const present=state.attendance.filter(a=>a.date===date&&!a.clockOut).length;
 const cards=staffNames.map(name=>{const tasks=tasksFor(name),att=attFor(name),done=doneFor(name),pct=tasks.length?Math.round(done/tasks.length*100):0;return `<article class="staff-card"><div class="staff-card-top"><div><h3>${esc(name)}</h3><div class="staff-role">${esc((state.settings.staffRoles||{})[name]|| (name===staffNames[0]?'ผู้จัดการร้าน':'พนักงานร้าน'))}</div></div><div class="actions"><button class="btn" data-action="staffedit" data-id="${esc(name)}">แก้ไข</button><button class="btn ${att&&!att.clockOut?'primary':''}" data-action="clockin" data-id="${esc(name)}" ${att&&!att.clockOut?'disabled':''}>เข้างาน</button><button class="btn" data-action="clockout" data-id="${esc(name)}" ${!att||!!att.clockOut?'disabled':''}>ออกงาน</button></div></div><div class="staff-meta">${att?`เข้างาน ${esc(att.clockIn||'—')} · ออกงาน ${esc(att.clockOut||'ยังไม่ออก')}${att.adjusted?' · มีการแก้ไข':''}`:'ไม่มีบันทึกเข้างาน'} · บันทึกสต็อก ${state.movements.filter(m=>m.staff===name&&String(m.date||'').slice(0,10)===date).length} รายการ</div><div class="staff-progress-row"><div class="progress"><span style="width:${pct}%"></span></div><b>${done}/${tasks.length} งาน</b></div><div class="staff-progress-label">${tasks.length?`ความคืบหน้าวันนี้ ${pct}%`:'ยังไม่มีงานในวันนี้'}</div><div class="staff-tasklist">${tasks.map(t=>`<div class="staff-task ${t.status==='done'?'done':''}"><input type="checkbox" ${t.status==='done'?'checked':''} data-action="tasktoggle" data-id="${esc(t.id)}" aria-label="ทำงานเสร็จ"><div class="task-text">${esc(t.title)}<small>${esc(t.notes|| (t.status==='review'?'รอตรวจ':t.status==='done'?'เสร็จแล้ว':'ยังไม่เสร็จ'))}</small></div><button class="btn" data-action="edittask" data-id="${esc(t.id)}">แก้ไข</button></div>`).join('')}</div><div class="staff-add-task"><input class="input" id="quickTask-${encodeURIComponent(name)}" placeholder="เพิ่มงานให้ ${esc(name)}"><button class="btn" data-action="staffaddtask" data-id="${esc(name)}">เพิ่ม</button></div></article>`}).join('');
 return `<div class="staff-head"><div><h2>งานพนักงานประจำวัน</h2><p>ความคืบหน้าวันที่เลือก ${completed}/${allToday.length} งาน</p></div><div class="actions"><button class="btn" data-action="tasktemplate">สร้างงานจากแม่แบบ</button><button class="btn" data-action="quicktask">มอบหมายงาน</button><button class="btn primary" data-action="staffadd">ลงทะเบียนพนักงาน</button></div></div><div class="staff-date"><label for="staffDate">วันที่</label><input class="input" id="staffDate" type="date" value="${esc(date)}"></div><div class="staff-grid">${cards}</div><div class="staff-subhead"><h3>รายการมอบหมายงานแยกตามผู้รับผิดชอบ</h3><button class="btn primary" data-action="quicktask">＋ มอบหมายงานใหม่</button></div><div class="staff-card"><div class="table-wrap"><table><thead><tr><th>งาน</th><th>ผู้รับผิดชอบ</th><th>กำหนดส่ง</th><th>สถานะ</th><th>รายละเอียด</th><th>จัดการ</th></tr></thead><tbody>${state.tasks.filter(t=>String(t.due||'').slice(0,10)===date).sort((a,b)=>String(a.due).localeCompare(String(b.due))).map(t=>`<tr><td><b>${esc(t.title)}</b><div class="small muted">${esc(t.id)}</div></td><td>${esc(t.assigned)}</td><td>${esc((t.due||'').replace('T',' '))}</td><td>${t.status==='done'?'เสร็จแล้ว':t.status==='review'?'รอตรวจ':'ยังไม่เสร็จ'}</td><td>${esc(t.notes||'—')}</td><td><button class="btn" data-action="edittask" data-id="${esc(t.id)}">แก้ไข/มอบหมายใหม่</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีงานที่มอบหมายในวันที่เลือก</td></tr>'}</tbody></table></div></div><div class="staff-footer">ลงทะเบียนพนักงาน มอบหมายงาน และติดตามความคืบหน้าแยกเป็นรายคน · ข้อมูลต้นแบบบันทึกไว้ในเบราว์เซอร์เครื่องนี้ · การใช้งานหลายเครื่องต้องพัฒนา Backend และฐานข้อมูลกลาง</div><div class="staff-subhead"><h3>ประวัติลงเวลาวันที่เลือก</h3><button class="btn" data-action="attendanceadjust">แก้ไขประวัติเวลา</button></div><div class="staff-card"><div class="table-wrap"><table><thead><tr><th>พนักงาน</th><th>เข้า</th><th>ออก</th><th>สถานะ</th></tr></thead><tbody>${state.attendance.filter(a=>a.date===date).map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.clockIn||'—')}</td><td>${esc(a.clockOut||'—')}</td><td>${a.adjusted?'แก้ไขแล้ว':a.clockOut?'ออกงานแล้ว':'กำลังทำงาน'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">ยังไม่มีรายการลงเวลาในวันที่เลือก</td></tr>'}</tbody></table></div></div>`
}
function integrations(){return `<div class="page-head"><div><h2>การเชื่อมต่อระบบ</h2><p>ตั้งค่าช่องทางนำเข้าข้อมูลและตรวจสอบสถานะการเชื่อมต่อ</p></div></div>

<div class="grid two-col"><div class="card"><div class="section-title"><h3>ช่องทางข้อมูล</h3><small>สถานะปัจจุบัน</small></div>
<div class="sync-row"><div class="sync-left"><div class="sync-logo">G</div><div><b>GPOS</b><p>ระบบขายหลัก · API หรือไฟล์รายงาน</p></div></div>${statusTag('ยังไม่เชื่อม')}</div>
<div class="sync-row"><div class="sync-left"><div class="sync-logo">S</div><div><b>Shopee Open Platform</b><p>ออเดอร์ สถานะ และรายการสินค้า</p></div></div>${statusTag('ยังไม่เชื่อม')}</div>
<div class="sync-row"><div class="sync-left"><div class="sync-logo">L</div><div><b>LINE Official Account</b><p>แจ้งเตือนสต็อก งานค้าง และการรับสินค้า</p></div></div>${statusTag('ยังไม่เชื่อม')}</div>
<div class="sync-row"><div class="sync-left"><div class="sync-logo">CSV</div><div><b>นำเข้าไฟล์ CSV</b><p>ใช้งานได้ในต้นแบบสำหรับสินค้าและออเดอร์</p></div></div>${statusTag('พร้อมทดลอง')}</div></div>
<div class="card"><div class="section-title"><h3>การตั้งค่าแจ้งเตือน</h3></div><label class="checkline"><input type="checkbox" id="minAlert" ${state.settings.minAlert?'checked':''}> แจ้งเตือนเมื่อสต็อกต่ำกว่าขั้นต่ำ</label><div style="height:12px"></div><label class="checkline"><input type="checkbox" id="lineEnabled" ${state.settings.lineEnabled?'checked':''}> เปิดใช้ LINE เมื่อเชื่อมต่อ API แล้ว</label><div class="field" style="margin-top:16px"><label>ผู้รับผิดชอบระบบ</label><input class="input" id="integrationOwner" placeholder="ชื่อผู้ดูแลระบบ"></div><div class="form-actions"><button class="btn primary" data-action="saveintegration">บันทึกการตั้งค่า</button></div><p class="footer-note">ห้ามใส่ Access Token หรือ Secret ลงในไฟล์ HTML หรือช่องที่ผู้ใช้งานทั่วไปเปิดดูได้ ควรจัดเก็บฝั่งเซิร์ฟเวอร์เท่านั้น</p></div></div>`}
function reports(){const low=state.products.filter(p=>p.qty<=p.min);const totalValue=state.products.reduce((s,p)=>s+p.qty*p.cost,0);const typeTotals=['retail','repack','raw','consumables'].map(t=>({t,count:state.products.filter(p=>p.type===t).length,value:state.products.filter(p=>p.type===t).reduce((s,p)=>s+p.qty*p.cost,0)}));return `<div class="page-head"><div><h2>รายงานร้านค้า</h2><p>ภาพรวมสต็อก มูลค่าต้นทุน และงานที่ต้องติดตาม</p></div><div class="actions"><button class="btn primary" data-action="export">↓ ส่งออกรายงาน JSON</button></div></div><div class="grid stats"><div class="card"><div class="stat-top">มูลค่าต้นทุนสต็อกโดยประมาณ</div><div class="stat-value">฿${fmt(totalValue)}</div><div class="stat-foot">คำนวณจากข้อมูลตัวอย่างที่กรอก</div></div><div class="card"><div class="stat-top">SKU ทั้งหมด</div><div class="stat-value">${state.products.length}</div></div><div class="card"><div class="stat-top">สินค้าต่ำกว่าขั้นต่ำ</div><div class="stat-value">${low.length}</div></div><div class="card"><div class="stat-top">ประวัติสต็อก</div><div class="stat-value">${state.movements.length}</div></div></div><div class="card"><div class="section-title"><h3>แยกตามประเภทคลัง</h3></div><div class="table-wrap"><table><thead><tr><th>ประเภท</th><th>จำนวน SKU</th><th>มูลค่าต้นทุนโดยประมาณ</th></tr></thead><tbody>${typeTotals.map(x=>`<tr><td>${typeLabel(x.t)}</td><td>${x.count}</td><td>฿${fmt(x.value)}</td></tr>`).join('')}</tbody></table></div><div class="section-title" style="margin-top:22px"><h3>ประวัติการเคลื่อนไหวล่าสุด</h3><button class="btn" data-action="movements">ดูทั้งหมด</button></div>${state.movements.length?`<div class="table-wrap"><table><thead><tr><th>วันเวลา</th><th>สินค้า</th><th>ประเภท</th><th>จำนวนเปลี่ยนแปลง</th><th>อ้างอิง</th></tr></thead><tbody>${state.movements.slice(0,10).map(m=>`<tr><td>${esc(m.date.replace('T',' ').slice(0,19))}</td><td>${esc(product(m.productId)?.name||m.productId)}</td><td>${esc(m.type)}</td><td>${m.qty>0?'+':''}${fmt(m.qty)}</td><td>$ function unlinkProductReferences(deleteIds){
  // Remove active recipe and purchase-order links to deleted products; keep historical stock movements.
  state.recipes=(state.recipes||[]).filter(r=>!deleteIds.has(r.outputId)).map(r=>({...r,items:(r.items||[]).filter(i=>!deleteIds.has(i.productId))}));
  state.purchaseOrders=(state.purchaseOrders||[]).map(po=>({...po,items:(po.items||[]).filter(i=>!deleteIds.has(i.productId))}));
}

function productModal(id,defaultType){const p=id?product(id):{sku:'',name:'',type:defaultType||'retail',category:(defaultType==='raw'?'วัตถุดิบผลิต':defaultType==='consumables'?'บรรจุภัณฑ์':'ของใช้ดูแลสัตว์'),unit:'ชิ้น',qty:0,min:0,cost:0,price:0};openModal(id?'แก้ไขสินค้า':'เพิ่มสินค้า',`<form id="productForm"><div class="form-grid"><div class="field"><label>SKU *</label><input class="input" name="sku" required value="${esc(p.sku)}"></div><div class="field"><label>ชื่อสินค้า *</label><input class="input" name="name" required value="${esc(p.name)}"></div><div class="field"><label>ประเภทคลัง *</label><select name="type">${[['retail','สินค้าขาย'],['repack','สินค้ารีแพ็ค'],['raw','วัตถุดิบผลิต'],['consumables','อุปกรณ์สิ้นเปลือง']].map(x=>`<option value="${x[0]}" ${p.type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field"><label>ประเภทสินค้า *</label><select name="category" required>${['วัตถุดิบผลิต','บรรจุภัณฑ์','ของใช้ดูแลสัตว์','ของใช้ภายในร้าน','อื่นๆ'].map(x=>`<option value="${x}" ${(p.category||(p.type==='raw'?'วัตถุดิบผลิต':p.type==='consumables'?'บรรจุภัณฑ์':p.type==='repack'?'วัตถุดิบผลิต':'ของใช้ดูแลสัตว์'))===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>หน่วยนับ *</label><select name="unit" class="input" required>${[...new Set(["ชิ้น","ตัว","ถุง","กล่อง","แพ็ค","ชุด","ขวด","กระปุก","กระสอบ","กิโลกรัม","กรัม","มิลลิลิตร","ลิตร","เมตร","เซนติเมตร","ใบ","แผ่น","ม้วน","คู่","ลัง","ฟอง","อัน",p.unit].filter(Boolean))].map(u=>`<option value="${esc(u)}" ${p.unit===u?"selected":""}>${esc(u)}</option>`).join("")}</select></div><div class="field"><label>ยอดคงเหลือเริ่มต้น</label><input class="input" name="qty" type="number" step="0.0001" min="0" value="${p.qty}"></div><div class="field"><label>จำนวนขั้นต่ำ</label><input class="input" name="min" type="number" step="0.0001" min="0" value="${p.min}"></div><div class="field"><label>ต้นทุนต่อหน่วย (บาท)</label><input class="input" name="cost" type="number" step="0.0001" min="0" value="${p.cost}"></div><div class="field"><label>ราคาขาย (บาท)</label><input class="input" name="price" type="number" step="0.01" min="0" value="${p.price}"></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">บันทึกสินค้า</button></div></form>`);$('#productForm').addEventListener('submit',e=>{e.preventDefault();try{const form=e.currentTarget;if(!form.reportValidity())return;const f=new FormData(form),sku=String(f.get('sku')||'').trim(),name=String(f.get('name')||'').trim(),unit=String(f.get('unit')||'').trim();if(!sku||!name||!unit)return toast('กรุณากรอก SKU ชื่อสินค้า และหน่วยนับ');if(state.products.some(x=>String(x.sku).toLowerCase()===sku.toLowerCase()&&x.id!==id))return toast('SKU นี้มีอยู่แล้ว');const data={id:id||'P'+uid(),sku,name,type:String(f.get('type')||'retail'),category:String(f.get('category')||'อื่นๆ'),unit,qty:Number(f.get('qty')||0),min:Number(f.get('min')||0),cost:Number(f.get('cost')||0),price:Number(f.get('price')||0)};if(!['retail','repack','raw','consumables'].includes(data.type)||![data.qty,data.min,data.cost,data.price].every(n=>Number.isFinite(n)&&n>=0))return toast('กรุณาตรวจสอบประเภทสินค้าและตัวเลขให้ถูกต้อง');if(id){const old=product(id);if(!old)return toast('ไม่พบสินค้าเดิม');if(data.qty!==old.qty)addMovement(id,data.type,data.qty-old.qty,'ปรับยอด','EDIT-'+id,'แก้ไขจากหน้าสินค้า');Object.assign(old,data)}else{state.products.push(data);if(data.qty)addMovement(data.id,data.type,data.qty,'ยอดตั้งต้น','NEW-'+data.id,'เพิ่มสินค้า')}if(!save())return toast('บันทึกไม่ได้: เบราว์เซอร์ปิดกั้นการจัดเก็บข้อมูล กรุณาเปิดไฟล์ผ่านเว็บเซิร์ฟเวอร์หรืออนุญาต Local Storage');closeModal();render();toast('บันทึกสินค้าแล้ว')}catch(err){console.error(err);toast('บันทึกสินค้าไม่สำเร็จ: '+(err.message||'เกิดข้อผิดพลาด'))}})}

 openModal('เบิกสินค้ารีแพ็คไปเติมสต็อกสินค้าขาย',`<p class="muted small">สต็อกทั้งสองประเภทแยกจากกัน การเบิกจะหักจากสินค้ารีแพ็คและเพิ่มเข้า SKU สินค้าขายเมื่อยืนยันเท่านั้น</p><form id="repackTransferForm"><div class="form-grid"><div class="field full"><label>เบิกจากสินค้ารีแพ็ค *</label><select name="source" required>${sources.map(p=>`<option value="${p.id}">${esc(p.sku)} — ${esc(p.name)} (คงเหลือ ${fmt(p.qty)} ${esc(p.unit)})</option>`).join('')}</select></div><div class="field full"><label>เติมเข้าสต็อกสินค้าขาย *</label><select name="target" required>${targets.map(p=>`<option value="${p.id}">${esc(p.sku)} — ${esc(p.name)} (คงเหลือ ${fmt(p.qty)} ${esc(p.unit)})</option>`).join('')}</select></div><div class="field"><label>จำนวนที่เบิกจากรีแพ็ค *</label><input class="input" name="sourceQty" type="number" min="0.0001" step="0.0001" required></div><div class="field"><label>จำนวนที่เติมเข้าสต็อกขาย *</label><input class="input" name="targetQty" type="number" min="0.0001" step="0.0001" required></div><div class="field full"><label>เลขอ้างอิง / หมายเหตุ</label><input class="input" name="note" placeholder="เช่น เบิกเติมหน้าร้าน / REF-001"></div></div><div class="notice" style="margin-top:12px">ระบุจำนวนทั้งสองช่องแยกกันได้ กรณีหน่วยนับต่างกัน เช่น เบิก 1 กล่อง แต่เติมสินค้าเป็น 12 ชิ้น</div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">ยืนยันการเบิกและเติมสต็อก</button></div></form>`);
 $('#repackTransferForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),src=product(f.get('source')),dst=product(f.get('target')),sq=Number(f.get('sourceQty')),dq=Number(f.get('targetQty')),note=String(f.get('note')||'').trim(),ref='RPT-'+uid();if(!src||src.type!=='repack'||!dst||dst.type!=='retail')return toast('ประเภทสินค้าต้นทางหรือปลายทางไม่ถูกต้อง');if(src.id===dst.id)return toast('สินค้ารีแพ็คและสินค้าขายต้องเป็นคนละรายการ');if(!(sq>0&&dq>0))return toast('จำนวนต้องมากกว่า 0');if(src.qty<sq)return toast('สต็อกสินค้ารีแพ็คไม่เพียงพอ');changeQty(src.id,-sq,'repack','เบิกรีแพ็คเติมสินค้าขาย',ref,`เบิกไปเติม ${dst.sku}; ${note}`);changeQty(dst.id,dq,'retail','รับเติมจากสินค้ารีแพ็ค',ref,`รับจาก ${src.sku}; ${note}`);state.stockTransfers=state.stockTransfers||[];state.stockTransfers.unshift({id:ref,date:new Date().toISOString(),sourceId:src.id,targetId:dst.id,sourceQty:sq,targetQty:dq,note});save();closeModal();render();toast('เบิกสินค้ารีแพ็คและเติมสต็อกสินค้าขายเรียบร้อย')};
}

function orderModal(o){o=o||{id:'SP-'+uid(),date:today(),channel:'Shopee',customer:'',status:'รอจัดเตรียม',total:0,items:'',tracking:'',note:''};openModal('เพิ่มรายการ Shopee',`<form id="orderForm"><div class="form-grid"><div class="field"><label>เลขออเดอร์ *</label><input class="input" name="id" required value="${esc(o.id)}"></div><div class="field"><label>วันที่</label><input class="input" name="date" type="date" value="${esc(o.date)}"></div><div class="field"><label>สถานะ</label><select name="status">${['รอจัดเตรียม','รอจัดส่ง','จัดส่งแล้ว','สำเร็จ','ยกเลิก','ต้องตรวจสอบ'].map(s=>`<option ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>ยอดรวม (บาท)</label><input class="input" name="total" type="number" min="0" step=".01" value="${o.total}"></div><div class="field full"><label>รายการสินค้า / จำนวน</label><textarea name="items" rows="2">${esc(o.items)}</textarea></div><div class="field"><label>เลขพัสดุ</label><input class="input" name="tracking" value="${esc(o.tracking)}"></div><div class="field"><label>หมายเหตุ</label><input class="input" name="note" value="${esc(o.note)}"></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">บันทึกออเดอร์</button></div></form>`);$('#orderForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const old=state.orders.find(x=>x.id===f.get('id'));const data={id:f.get('id').trim(),date:f.get('date'),channel:'Shopee',status:f.get('status'),total:+f.get('total'),items:f.get('items'),tracking:f.get('tracking'),note:f.get('note')};if(old&&(!o.id||old.id!==o.id))return toast('เลขออเดอร์ซ้ำ');if(o.id&&state.orders.some(x=>x.id===data.id)&&o.id!==data.id)return toast('เลขออเดอร์ซ้ำ');if(o.id&&state.orders.some(x=>x.id===o.id)){Object.assign(state.orders.find(x=>x.id===o.id),data)}else state.orders.unshift(data);save();closeModal();render();toast('บันทึกออเดอร์แล้ว')}}

function poModal(){openModal('สร้างใบสั่งซื้อ',`<form id="poForm"><div class="form-grid"><div class="field"><label>เลขที่ PO</label><input class="input" name="id" value="PO-${new Date().getFullYear()}-${uid()}" required></div><div class="field"><label>ผู้จำหน่าย</label><input class="input" name="supplier" required></div><div class="field"><label>วันที่สั่ง</label><input class="input" name="date" type="date" value="${today()}"></div><div class="field"><label>กำหนดรับ</label><input class="input" name="expected" type="date" value="${today()}"></div><div class="field full"><label>รายการสินค้า</label><div id="poLines"></div><button type="button" class="btn" id="addPoLine" style="margin-top:8px">＋ เพิ่มรายการสินค้า</button></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">สร้างใบสั่งซื้อ</button></div></form>`);const addLine=()=>{const div=document.createElement('div');div.className='form-grid po-line';div.style.cssText='grid-template-columns:2fr 1fr 1fr;gap:8px;margin:10px 0';div.innerHTML=`<select name="pid">${state.products.map(p=>`<option value="${p.id}">${esc(p.sku)} · ${esc(p.name)} [${esc(p.category||'อื่นๆ')}]</option>`).join('')}</select><input class="input" name="qty" type="number" min=".0001" step=".0001" placeholder="จำนวน" required><input class="input" name="cost" type="number" min="0" step=".0001" placeholder="ต้นทุน/หน่วย" required>`;$('#poLines').appendChild(div)};addLine();$('#addPoLine').onclick=addLine;$('#poForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),lines=[...document.querySelectorAll('.po-line')].map(l=>({productId:l.querySelector('[name=pid]').value,qty:+l.querySelector('[name=qty]').value,received:0,cost:+l.querySelector('[name=cost]').value,location:product(l.querySelector('[name=pid]').value).type}));if(state.purchaseOrders.some(p=>p.id===f.get('id')))return toast('เลข PO ซ้ำ');state.purchaseOrders.unshift({id:f.get('id'),supplier:f.get('supplier'),date:f.get('date'),expected:f.get('expected'),status:'รอรับสินค้า',items:lines});save();closeModal();render();toast('สร้างใบสั่งซื้อแล้ว')}}
function receiveModal(id){const po=state.purchaseOrders.find(p=>p.id===id);if(!po)return;openModal('ตรวจรับสินค้า '+po.id,`<form id="receiveForm"><p class="muted small">กรอกจำนวนที่รับเพิ่มในรอบนี้ ระบบจะเพิ่มสต็อกเฉพาะจำนวนที่รับจริง</p><div class="table-wrap"><table><thead><tr><th>สินค้า / คลัง</th><th>สั่ง</th><th>รับสะสม</th><th>รับเพิ่ม</th></tr></thead><tbody>${po.items.map((it,i)=>`<tr><td>${esc(product(it.productId)?.name||it.productId)}<div class="small muted">ประเภทสินค้า: ${esc(product(it.productId)?.category||'อื่นๆ')} · คลัง: ${typeLabel(it.location)}</div></td><td>${fmt(it.qty)}</td><td>${fmt(it.received)}</td><td><input class="input" style="width:95px" type="number" min="0" step=".0001" max="${Math.max(0,it.qty-it.received)}" name="recv${i}" value="0"></td></tr>`).join('')}</tbody></table></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">ยืนยันรับสินค้า</button></div></form>`);$('#receiveForm').addEventListener('submit',e=>{e.preventDefault();try{const form=e.currentTarget;if(!form.reportValidity())return;const f=new FormData(form),receipts=po.items.map((it,i)=>({it,q:Number(f.get('recv'+i)||0)}));if(receipts.some(x=>!Number.isFinite(x.q)||x.q<0))return toast('กรุณากรอกจำนวนรับเป็นตัวเลขศูนย์หรือมากกว่า');const over=receipts.find(x=>x.q>x.it.qty-x.it.received+1e-8);if(over)return toast('จำนวนรับเกินจำนวนค้างรับของ '+(product(over.it.productId)?.name||over.it.productId));if(!receipts.some(x=>x.q>0))return toast('กรุณากรอกจำนวนรับอย่างน้อย 1 รายการ');for(const x of receipts){if(x.q>0&&!product(x.it.productId))return toast('ไม่พบสินค้าในใบสั่งซื้อ กรุณาตรวจสอบรายการ')}receipts.forEach(({it,q})=>{if(q>0){it.received=Number((it.received+q).toFixed(4));changeQty(it.productId,q,it.location,'รับสินค้า',po.id,'รับเข้าจากใบสั่งซื้อ')}});po.status=po.items.every(it=>it.received>=it.qty-1e-8)?'รับครบ':'รับบางส่วน';if(!save())return toast('รับสินค้าแล้วแต่บันทึกถาวรไม่ได้: กรุณาเปิดผ่านเว็บเซิร์ฟเวอร์และตรวจสิทธิ์จัดเก็บข้อมูล');closeModal();render();toast('บันทึกการรับสินค้าแล้ว')}catch(err){console.error(err);toast('ยืนยันรับสินค้าไม่สำเร็จ: '+(err.message||'เกิดข้อผิดพลาด'))}})}

function batchModal(){if(!state.recipes.length)return toast('กรุณาสร้างสูตรก่อน');openModal('สร้างใบงานผลิต',`<form id="batchForm"><div class="form-grid"><div class="field full"><label>สูตร</label><select name="recipeId">${state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)} · v${esc(r.version)}</option>`).join('')}</select></div><div class="field"><label>จำนวนที่วางแผนผลิต (หน่วยผลผลิต)</label><input class="input" name="qty" type="number" min=".0001" step=".0001" required value="10"></div><div class="field"><label>ผู้ผลิต</label><input class="input" name="staff" required placeholder="ชื่อพนักงาน"></div><div class="field full"><label>หมายเหตุ</label><textarea class="input" name="notes" rows="2"></textarea></div></div><div id="batchPreview" class="notice" style="margin-top:14px"></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">สร้างและยืนยันผลิต</button></div></form>`);const preview=()=>{const r=state.recipes.find(x=>x.id===$('#batchForm').recipeId.value),q=+$('#batchForm').qty.value||0;$('#batchPreview').innerHTML='<b>ประมาณการวัตถุดิบที่ต้องใช้</b><br>'+r.items.map(i=>{const p=product(i.productId);return `${esc(p?.name)}: ${fmt(i.qty*q/r.batchSize)} ${esc(p?.unit||'')}${p&&p.qty<i.qty*q/r.batchSize?' <b style="color:#a53d36">— ไม่เพียงพอ</b>':''}`}).join('<br>')};$('#batchForm').recipeId.onchange=preview;$('#batchForm').qty.oninput=preview;preview();$('#batchForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),r=state.recipes.find(x=>x.id===f.get('recipeId')),q=+f.get('qty');const req=r.items.map(i=>({i,p:product(i.productId),need:i.qty*q/r.batchSize}));const shortage=req.find(x=>!x.p||x.p.qty+1e-8<x.need);if(shortage)return toast('วัตถุดิบไม่เพียงพอ: '+(shortage.p?.name||''));const output=product(r.outputId);if(!output)return toast('ไม่พบสินค้าปลายทาง');req.forEach(x=>changeQty(x.p.id,-x.need,x.p.type,'เบิกผลิต','BATCH-'+uid(),r.name));const batchId='BATCH-'+uid();/* create stable references for movements */state.movements.slice(0,req.length).forEach(m=>{if(m.ref.startsWith('BATCH-'))m.ref=batchId});output.qty+=q;addMovement(output.id,output.type,q,'ผลิตสำเร็จ',batchId,'ผลิตโดย '+f.get('staff'));state.batches.unshift({id:batchId,recipeId:r.id,outputId:output.id,outputName:output.name,plannedQty:q,actualQty:q,wasteQty:0,unit:output.unit,staff:f.get('staff'),notes:f.get('notes'),status:'ผลิตสำเร็จ',date:new Date().toISOString()});save();closeModal();render();toast('ยืนยันผลิตและปรับสต็อกแล้ว')}}
function taskModal(t){t=t||{title:'',assigned:'',due:today()+'T17:00',notes:'',status:'todo'};openModal(t.id?'แก้ไขงาน':'มอบหมายงาน',`<form id="taskForm"><div class="form-grid"><div class="field full"><label>ชื่องาน *</label><input class="input" name="title" required value="${esc(t.title)}"></div><div class="field"><label>ผู้รับผิดชอบ *</label><select name="assigned" required>${[...new Set([...(state.settings.staffMembers||[]),...state.tasks.map(x=>x.assigned),t.assigned].filter(Boolean))].map(n=>`<option value="${esc(n)}" ${t.assigned===n?'selected':''}>${esc(n)}</option>`).join('')||'<option value="">ลงทะเบียนพนักงานก่อน</option>'}</select></div><div class="field"><label>กำหนดส่ง</label><input class="input" type="datetime-local" name="due" value="${esc(t.due)}"></div><div class="field"><label>สถานะ</label><select name="status">${[['todo','ยังไม่เสร็จ'],['review','รอตรวจ'],['done','เสร็จแล้ว']].map(x=>`<option value="${x[0]}" ${t.status===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><div class="field full"><label>รายละเอียด / Checklist</label><textarea class="input" name="notes" rows="3">${esc(t.notes)}</textarea></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">บันทึกงาน</button></div></form>`);$('#taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),data={id:t.id||'T'+uid(),title:f.get('title'),assigned:f.get('assigned'),due:f.get('due'),status:f.get('status'),notes:f.get('notes')};if(t.id)Object.assign(state.tasks.find(x=>x.id===t.id),data);else state.tasks.unshift(data);save();closeModal();render();toast('บันทึกงานแล้ว')}}
function editTaskModal(id){const t=state.tasks.find(x=>x.id===id);if(t)taskModal(t)}
function staffMemberModal(name){const existing=!!name;openModal(existing?'แก้ไขพนักงาน':'เพิ่มพนักงาน',`<form id="staffMemberForm"><div class="form-grid"><div class="field full"><label>ชื่อพนักงาน *</label><input class="input" name="name" required value="${esc(name||'')}"></div><div class="field full"><label>ตำแหน่ง</label><select name="role"><option>พนักงานร้าน</option><option>ผู้จัดการร้าน</option><option>พนักงานคลังสินค้า</option><option>พนักงานแพ็กสินค้า</option></select></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">บันทึก</button></div></form>`);$('#staffMemberForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),old=(name||'').trim(),next=String(f.get('name')).trim(),role=String(f.get('role'));if(!next)return toast('กรุณากรอกชื่อพนักงาน');state.settings.staffMembers=state.settings.staffMembers||[];if(old&&old!==next){state.settings.staffMembers=state.settings.staffMembers.map(n=>n===old?next:n);state.attendance.forEach(a=>{if(a.name===old)a.name=next});state.tasks.forEach(t=>{if(t.assigned===old)t.assigned=next});if(state.settings.staffRoles&&state.settings.staffRoles[old])delete state.settings.staffRoles[old]}if(!state.settings.staffMembers.includes(next))state.settings.staffMembers.push(next);state.settings.staffRoles=state.settings.staffRoles||{};state.settings.staffRoles[next]=role;save();closeModal();render();toast(existing?'แก้ไขข้อมูลพนักงานแล้ว':'เพิ่มพนักงานแล้ว')}}
function clock(mode,nameOverride){const name=(nameOverride||$('#attendanceName')?.value||'').trim();if(!name)return toast('ไม่พบชื่อพนักงาน');const now=new Date(),time=now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});if(mode==='in'){if(state.attendance.some(a=>a.name===name&&a.date===today()&&!a.clockOut))return toast('พนักงานนี้ลงเวลาเข้างานแล้ว');state.attendance.unshift({id:'AT'+uid(),name,date:today(),clockIn:time,clockOut:'',adjusted:false,history:[]});toast('บันทึกเวลาเข้างานแล้ว')}else{const a=state.attendance.find(a=>a.name===name&&a.date===today()&&!a.clockOut);if(!a)return toast('ไม่พบรายการเข้างานที่ยังไม่ออก');a.clockOut=time;toast('บันทึกเวลาออกงานแล้ว')}save();render()}
function attendanceAdjustModal(){openModal('แก้ไขประวัติลงเวลา',`<form id="attForm"><div class="form-grid"><div class="field full"><label>รายการลงเวลา</label><select name="id">${state.attendance.map(a=>`<option value="${a.id}">${esc(a.name)} · ${esc(a.date)} · เข้า ${esc(a.clockIn)} / ออก ${esc(a.clockOut||'—')}</option>`).join('')}</select></div><div class="field"><label>เวลาเข้างานใหม่</label><input class="input" name="clockIn" placeholder="เช่น 09:00"></div><div class="field"><label>เวลาออกงานใหม่</label><input class="input" name="clockOut" placeholder="เช่น 18:00"></div><div class="field full"><label>เหตุผลที่แก้ไข *</label><textarea class="input" name="reason" required></textarea></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button type="submit" class="btn primary">บันทึกการแก้ไข</button></div></form>`);$('#attForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),a=state.attendance.find(x=>x.id===f.get('id'));if(!a)return toast('ยังไม่มีประวัติลงเวลา');a.history=a.history||[];a.history.push({oldIn:a.clockIn,oldOut:a.clockOut,newIn:f.get('clockIn')||a.clockIn,newOut:f.get('clockOut')||a.clockOut,reason:f.get('reason'),at:new Date().toISOString()});a.clockIn=f.get('clockIn')||a.clockIn;a.clockOut=f.get('clockOut')||a.clockOut;a.adjusted=true;state.adjustments.unshift({attendanceId:a.id,reason:f.get('reason'),at:new Date().toISOString(),oldIn:a.history.at(-1).oldIn,oldOut:a.history.at(-1).oldOut,newIn:a.clockIn,newOut:a.clockOut});save();closeModal();render();toast('บันทึกการแก้ไขพร้อมประวัติแล้ว')}}
function importModal(kind){const isProductImport=kind==='products'||kind==='repackproducts';const isRepackImport=kind==='repackproducts';const title=isRepackImport?'นำเข้าสินค้ารีแพ็คจาก CSV / Excel':kind==='products'?'นำเข้าสินค้าจาก Excel / CSV':kind==='orders'?'นำเข้าออเดอร์จาก Excel / CSV':'นำเข้าใบสั่งซื้อจาก Excel / CSV';const hint=isProductImport?'sku,name,type,unit,qty,min,cost,price':kind==='orders'?'id,date,status,total,items,tracking':'id,supplier,date,expected,sku,qty,cost';openModal(title,`<p class="muted small">รองรับ Excel (.xlsx, .xls) และ CSV (.csv) โดยอ่านข้อมูลจากชีตแรกของไฟล์ Excel แถวแรกต้องเป็นชื่อคอลัมน์ตามตัวอย่าง</p><div class="field"><label>เลือกไฟล์ Excel หรือ CSV</label><input class="input" type="file" id="dataFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv"></div><div class="field" style="margin-top:12px"><label>หรือวางข้อมูล CSV</label><textarea class="input" id="csvText" rows="6" placeholder="${hint}\n..."></textarea></div><div class="actions" style="margin-top:12px"><button type="button" class="btn" id="downloadTemplate">↓ ดาวน์โหลดแม่แบบ Excel</button></div><p class="footer-note">ชนิดคลังใช้ค่า retail, repack, raw หรือ consumables · หากเป็นไฟล์ Excel ต้องเชื่อมต่ออินเทอร์เน็ตเพื่อโหลดตัวอ่านไฟล์ SheetJS</p><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn primary" id="runImport">ตรวจสอบและนำเข้า</button></div>`);let parsedRows=null;$('#dataFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.name.toLowerCase().endsWith('.csv')){$('#csvText').value=await file.text();parsedRows=null;return}if(!window.XLSX)throw Error('โหลดตัวอ่าน Excel ไม่สำเร็จ กรุณาเชื่อมต่ออินเทอร์เน็ต หรือบันทึกไฟล์เป็น CSV');const data=await file.arrayBuffer();const wb=XLSX.read(data,{type:'array',cellDates:true});const ws=wb.Sheets[wb.SheetNames[0]];parsedRows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});$('#csvText').value='อ่านไฟล์ Excel แล้ว: '+file.name+'\nชีต: '+wb.SheetNames[0]+'\nจำนวนแถวข้อมูล: '+Math.max(0,parsedRows.length-1)+'\nกด “ตรวจสอบและนำเข้า” เพื่อดำเนินการ';}catch(err){parsedRows=null;toast(err.message||'อ่านไฟล์ไม่สำเร็จ')}};$('#downloadTemplate').onclick=()=>{if(!window.XLSX)return toast('ตัวอ่าน Excel ยังไม่พร้อม กรุณาเชื่อมต่ออินเทอร์เน็ต');let headers,example;if(isProductImport){headers=['sku','name','type','unit','qty','min','cost','price'];example=['REP-001','ธัญพืชรวมรีแพ็ค 100 กรัม',isRepackImport?'repack':'retail','ถุง',35,10,12,25]}else if(kind==='orders'){headers=['id','date','status','total','items','tracking'];example=['SP-ORDER-001',today(),'รอจัดเตรียม',125,'อาหารแฮมสเตอร์ x 2','']}else{headers=['id','supplier','date','expected','sku','qty','cost'];example=['PO-2026-0001','ผู้จำหน่ายตัวอย่าง',today(),today(),'HAM-FOOD-001',10,45]}const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([headers,example]);XLSX.utils.book_append_sheet(wb,ws,'Import');XLSX.writeFile(wb,`template_${kind}.xlsx`)};$('#runImport').onclick=()=>{try{let rows=parsedRows;if(!rows){const raw=$('#csvText').value.trim();if(!raw)return toast('กรุณาเลือกไฟล์ Excel/CSV หรือวางข้อมูล CSV');if(raw.startsWith('อ่านไฟล์ Excel แล้ว:'))return toast('กรุณาเลือกไฟล์ Excel อีกครั้ง แล้วลองนำเข้าใหม่');rows=parseCSV(raw)}if(!rows||rows.length<2)throw Error('ไม่พบแถวข้อมูล');const headers=rows[0].map(x=>String(x).trim().toLowerCase());const get=(r,k)=>{const i=headers.indexOf(k);return i<0?'':String(r[i]??'').trim()};let count=0;if(isProductImport){rows.slice(1).forEach(r=>{const sku=get(r,'sku');if(!sku)return;let p=state.products.find(x=>x.sku.toLowerCase()===sku.toLowerCase());const type=isRepackImport?'repack':(get(r,'type')||'retail');if(isRepackImport&&p&&p.type!=='repack')throw Error('SKU '+sku+' มีอยู่แล้วแต่ไม่ใช่สินค้ารีแพ็ค');if(!['retail','repack','raw','consumables'].includes(type))throw Error('ชนิดคลังไม่ถูกต้องสำหรับ SKU '+sku);const data={sku,name:get(r,'name')||sku,type,unit:get(r,'unit')||'ชิ้น',qty:Number(get(r,'qty'))||0,min:Number(get(r,'min'))||0,cost:Number(get(r,'cost'))||0,price:Number(get(r,'price'))||0};if(data.qty<0||data.min<0||data.cost<0||data.price<0)throw Error('พบจำนวนหรือต้นทุนติดลบ: '+sku);if(p)Object.assign(p,data);else state.products.push({id:'P'+uid(),...data});count++})}else if(kind==='orders'){rows.slice(1).forEach(r=>{const id=get(r,'id');if(!id)return;let o=state.orders.find(x=>x.id===id);const data={id,date:get(r,'date')||today(),channel:'Shopee',status:get(r,'status')||'ต้องตรวจสอบ',total:Number(get(r,'total'))||0,items:get(r,'items'),tracking:get(r,'tracking'),note:'นำเข้าจาก Excel/CSV'};if(o)Object.assign(o,data);else state.orders.push(data);count++})}else{const grouped={};rows.slice(1).forEach(r=>{const id=get(r,'id');if(!id)return;if(!grouped[id])grouped[id]={id,supplier:get(r,'supplier'),date:get(r,'date')||today(),expected:get(r,'expected')||today(),status:'รอรับสินค้า',items:[]};const sku=get(r,'sku'),p=state.products.find(x=>x.sku.toLowerCase()===sku.toLowerCase());if(!p)throw Error('ไม่พบ SKU ในระบบ: '+sku);const qty=Number(get(r,'qty')),cost=Number(get(r,'cost'));if(!(qty>0)||cost<0)throw Error('จำนวนสั่งซื้อต้องมากกว่า 0 และต้นทุนต้องไม่ติดลบ: '+sku);grouped[id].items.push({productId:p.id,qty,received:0,cost,location:p.type})});Object.values(grouped).forEach(po=>{const existing=state.purchaseOrders.find(x=>x.id===po.id);if(existing)throw Error('เลข PO ซ้ำ: '+po.id);if(po.items.length){state.purchaseOrders.push(po);count++}})}state.importBatches.unshift({id:'IMP'+uid(),kind,count,at:new Date().toISOString()});save();closeModal();render();toast(`นำเข้าข้อมูลแล้ว ${count} รายการ`)}catch(e){toast('นำเข้าไม่สำเร็จ: '+e.message)}}}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'&&quoted&&text[i+1]==='"'){cell+='"';i++}else if(c==='"'){quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='baan-khantok-hamster-backup-'+today()+'.json';a.click();URL.revokeObjectURL(url);toast('ส่งออกข้อมูลสำรองแล้ว')}
function importBackup(){openModal('กู้คืนข้อมูลจาก JSON',`<div class="field"><label>เลือกไฟล์สำรอง JSON</label><input class="input" type="file" id="backupFile" accept=".json,application/json"></div><div class="form-actions"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn primary" id="restoreBtn">กู้คืนข้อมูล</button></div>`);$('#restoreBtn').onclick=async()=>{const file=$('#backupFile').files[0];if(!file)return toast('กรุณาเลือกไฟล์');try{const obj=JSON.parse(await file.text());if(!Array.isArray(obj.products)||!Array.isArray(obj.orders))throw Error('รูปแบบไฟล์ไม่ถูกต้อง');if(!confirm('ข้อมูลปัจจุบันจะถูกแทนที่ ต้องการดำเนินการหรือไม่?'))return;state={...structuredClone(defaults),...obj};save();closeModal();render();toast('กู้คืนข้อมูลแล้ว')}catch(e){toast('กู้คืนไม่สำเร็จ: '+e.message)}}}
$('#exportBtn').onclick=exportData;
render();
</script>
